services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyperprofile
      POSTGRES_PASSWORD: hyperprofile
      POSTGRES_DB: hyperprofile
    ports:
      - "5432:5432"
    volumes:
      - hp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperprofile -d hyperprofile"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1025:1025"
      - "1080:1080"

volumes:
  hp_pg:
