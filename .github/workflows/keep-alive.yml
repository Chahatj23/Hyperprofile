name: Keep Render Service Awake

on:
  schedule:
    # Runs every 10 minutes (valid cron step, prevents 15-min Render spin-down)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Hyperprofile Render API..."
          curl -sS --retry 3 --retry-delay 5 --max-time 60 "https://hyperprofile-api.onrender.com/health"
          echo "API is awake and healthy."

